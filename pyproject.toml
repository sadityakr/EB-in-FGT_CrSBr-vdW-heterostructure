[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eb-in-fgt-crsbr"
version = "0.1.0"
description = "Analysis scripts for exchange bias in FGT/CrSBr heterostructures"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "h5py",
]

[tool.setuptools]
packages = ["scripts", "scripts.utils"]
